services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start --import-realm
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: 127.0.0.1
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-reconq.json:/opt/keycloak/data/import/reconq.json:ro
      - ./keycloak/realm-reconq-app.json:/opt/keycloak/data/import/reconq-app.json:ro
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      ssh:
        - default
    env_file:
      - ./backend/.env
    environment:
      KEYCLOAK_URL: http://127.0.0.1:8080
    network_mode: host
    restart: on-failure

  subscription-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      ssh:
        - default
    env_file:
      - ./backend/.env
    environment:
      KEYCLOAK_URL: http://127.0.0.1:8080
    network_mode: host
    restart: on-failure
    command: ["/venv/bin/python", "-m", "backend.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: shell
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:80"
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: remote
    ports:
      - "5001:80"
  customers:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: customers
    ports:
      - "5002:80"
  subscriptions:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: subscriptions
    ports:
      - "5003:80"
